name: Deploy API
on:
  workflow_dispatch:
  push:
    paths: ['apps/api/**']
jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd apps/api && npm ci && npm run build
      - run: cd apps/api && npx serverless deploy --stage dev
