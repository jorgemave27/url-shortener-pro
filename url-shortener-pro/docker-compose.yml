version: "3.9"

services:
  # 🔥 Redis para cache (performance)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 🔥 PostgreSQL para persistencia
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - "6380:6379"
